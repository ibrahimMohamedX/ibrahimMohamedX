lvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#b8b8c4" >Available for remote work</text><text x="54" y="150" font-family="'Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#f4f4f6" letter-spacing="-1.5" >Need a Flutter engineer?</text><text x="56" y="206" font-family="'Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#b8b8c4" >I'm looking for a remote role on a team that ships mobile, desktop and SaaS products.</text><text x="56" y="252" font-family="'Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#a78bfa" >ibrahimmohamed09854@gmail.com</text></g><rect x="0.5" y="0.5" width="1199" height="299" rx="24" fill="none" stroke="#26262b"/></svg>