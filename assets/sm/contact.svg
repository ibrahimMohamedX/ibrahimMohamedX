ily="'Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#f4f4f6" letter-spacing="-1.2" >Need a Flutter</text><text x="34" y="186" font-family="'Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#f4f4f6" letter-spacing="-1.2" >engineer?</text><text x="36" y="232" font-family="'Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#b8b8c4" >I'm looking for a remote role on a team that ships mobile,</text><text x="36" y="260" font-family="'Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#b8b8c4" >desktop and SaaS products.</text><text x="36" y="316" font-family="'Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#a78bfa" >ibrahimmohamed09854@gmail.com</text></g><rect x="0.5" y="0.5" width="599" height="359" rx="24" fill="none" stroke="#26262b"/></svg>