<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Portfolio"><title>Portfolio</title><desc>Bilingual personal website in English and Arabic, built with React and Vite.</desc><defs><clipPath id="wo-clip"><rect width="1200" height="300" rx="24"/></clipPath><radialGradient id="wo-hue" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.2"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient></defs><style>@font-face{font-family:'Plex Sans';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Plex Sans';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Plex Sans';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}.wo-pulse{transform-box:fill-box;transform-origin:center;animation:wo-pulse 2.2s ease-in-out infinite}@keyframes wo-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.7)}}.wo-en{animation:wo-en 8s ease-in-out infinite}.wo-ar{animation:wo-ar 8s ease-in-out infinite}.wo-thumb{animation:wo-thumb 8s ease-in-out infinite}@keyframes wo-en{0%,44%{opacity:1}50%,94%{opacity:0}100%{opacity:1}}@keyframes wo-ar{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}@keyframes wo-thumb{0%,44%{transform:translateX(0)}50%,94%{transform:translateX(26px)}100%{transform:translateX(0)}}@media (prefers-reduced-motion: reduce){.wo-en,.wo-ar,.wo-thumb{animation:none!important}.wo-ar{opacity:0}}</style><g clip-path="url(#wo-clip)"><rect width="1200" height="300" rx="24" fill="#111113"/><circle cx="300" cy="165" r="360" fill="url(#wo-hue)"/><circle cx="645" cy="57" r="4.5" fill="#22d3ee" class="wo-pulse"/><text x="658" y="62" font-family="'Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#b8b8c4" >Live at himego.vercel.app</text